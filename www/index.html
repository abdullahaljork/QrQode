<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Tool</title>
<script src="qrcode.js"></script>
<script src="qrcode_UTF8.js"></script>
<script src="jsQR.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--ac:#2563eb;--mu:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f4;--mu:#9aa3b2}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font-size:16px}
.tabs button.on{background:var(--ac);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px}
input,textarea,select{width:100%;margin-top:8px;border:1px solid #8884;border-radius:12px;padding:11px;font-size:16px;background:transparent;color:var(--tx);font-family:inherit}
select option{color:#000}
textarea{min-height:90px;resize:vertical}
.ltr{direction:ltr;text-align:left}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px}
.btn.sec{background:#8883;color:var(--tx)}
canvas#qr{display:block;margin:16px auto 0;max-width:100%;background:#fff;border-radius:8px}
video{width:100%;border-radius:12px;background:#000;max-height:50vh}
#res{margin-top:12px;padding:12px;border-radius:12px;background:#8882;word-break:break-all;white-space:pre-wrap;direction:ltr;text-align:left}
.hide{display:none}
.home{display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:80vh}
.home h1{text-align:center;margin:0 0 8px}
.home button{padding:34px 12px;border:0;border-radius:20px;background:var(--ac);color:#fff;font-size:22px}
.home button#t2{background:#16a34a}
.mu{color:var(--mu);font-size:14px;margin-top:8px}
.row{display:flex;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="home" class="home">
    <h1>QR Tool</h1>
    <button id="t1">إنشاء QR</button>
    <button id="t2">قراءة QR</button>
  </div>
  <button id="back" class="btn sec hide" style="margin:0 0 12px">رجوع ←</button>

  <div id="p1" class="card hide">
    <select id="type">
      <option value="text">نص / رمز</option>
      <option value="web">موقع ويب</option>
      <option value="wa">واتساب</option>
      <option value="contact">جهة اتصال</option>
      <option value="mail">بريد إلكتروني</option>
    </select>

    <div id="f-text" class="f"><textarea id="i-text" placeholder="اكتب النص أو الرمز..."></textarea></div>
    <div id="f-web" class="f hide"><input id="i-web" class="ltr" placeholder="example.com" inputmode="url"></div>
    <div id="f-wa" class="f hide">
      <input id="i-wa" class="ltr" placeholder="رقم مع رمز الدولة: 963912345678" inputmode="tel">
      <textarea id="i-wam" placeholder="رسالة جاهزة (اختياري)"></textarea>
    </div>
    <div id="f-contact" class="f hide">
      <input id="c-name" placeholder="الاسم">
      <input id="c-phone" class="ltr" placeholder="الهاتف" inputmode="tel">
      <input id="c-mail" class="ltr" placeholder="البريد الإلكتروني" inputmode="email">
      <input id="c-org" placeholder="الشركة / الجهة (اختياري)">
    </div>
    <div id="f-mail" class="f hide">
      <input id="m-to" class="ltr" placeholder="name@example.com" inputmode="email">
      <input id="m-sub" placeholder="الموضوع (اختياري)">
      <textarea id="m-body" placeholder="نص الرسالة (اختياري)"></textarea>
    </div>

    <div class="row">
      <button class="btn sec" id="logoBtn">إضافة لوغو (اختياري)</button>
      <button class="btn sec hide" id="logoDel">حذف اللوغو</button>
    </div>
    <input type="file" id="logoFile" accept="image/*" class="hide">

    <button class="btn" id="gen">إنشاء الـ QR</button>
    <canvas id="qr" class="hide"></canvas>
    <button class="btn sec hide" id="dl">تنزيل / مشاركة الصورة</button>
  </div>

  <div id="p2" class="card hide">
    <video id="vid" playsinline muted></video>
    <button class="btn" id="cam">تشغيل الكاميرا</button>
    <button class="btn sec" id="pick">قراءة من صورة</button>
    <input type="file" id="file" accept="image/*" class="hide">
    <div id="res" class="hide"></div>
    <button class="btn sec hide" id="copy">نسخ النتيجة</button>
    <button class="btn sec hide" id="open">فتح</button>
    <div class="mu" id="msg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
let stream=null,raf=null,logo=null;

function tab(n,push){
  $('home').classList.toggle('hide',n!==0);
  $('back').classList.toggle('hide',n===0);
  $('p1').classList.toggle('hide',n!==1);
  $('p2').classList.toggle('hide',n!==2);
  if(n!==2)stopCam();
  if(n&&push!==false)history.pushState({n},'');
}
$('t1').onclick=()=>tab(1);
$('t2').onclick=()=>tab(2);
$('back').onclick=()=>history.back();
window.addEventListener('popstate',()=>tab(0,false));

// فتح الشاشة من أزرار الإعدادات السريعة
(function(){
  const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!A)return;
  const go=u=>{if(!u)return;if(/\/\/create/.test(u))tab(1);else if(/\/\/read/.test(u))tab(2);};
  A.getLaunchUrl().then(r=>go(r&&r.url)).catch(()=>{});
  A.addListener('appUrlOpen',e=>go(e.url));
})();

$('type').onchange=()=>{
  document.querySelectorAll('.f').forEach(e=>e.classList.add('hide'));
  $('f-'+$('type').value).classList.remove('hide');
};

// ---------- اللوغو ----------
$('logoBtn').onclick=()=>$('logoFile').click();
$('logoFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{logo=img;$('logoDel').classList.remove('hide');$('logoBtn').textContent='تغيير اللوغو';};
  img.src=URL.createObjectURL(f);
  e.target.value='';
};
$('logoDel').onclick=()=>{logo=null;$('logoDel').classList.add('hide');$('logoBtn').textContent='إضافة لوغو (اختياري)';};

// ---------- إنشاء ----------
function payload(){
  const t=$('type').value,g=id=>$(id).value.trim();
  if(t==='text')return g('i-text');
  if(t==='web'){const u=g('i-web');return u&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)?'https://'+u:u;}
  if(t==='wa'){
    const n=g('i-wa').replace(/\D/g,'').replace(/^00/,'');
    if(!n)return '';
    const m=g('i-wam');
    return 'https://wa.me/'+n+(m?'?text='+encodeURIComponent(m):'');
  }
  if(t==='contact'){
    const name=g('c-name'),ph=g('c-phone'),em=g('c-mail'),org=g('c-org');
    if(!name&&!ph)return '';
    return ['BEGIN:VCARD','VERSION:3.0','FN:'+name,'N:;'+name+';;;',ph&&'TEL:'+ph,em&&'EMAIL:'+em,org&&'ORG:'+org,'END:VCARD'].filter(Boolean).join('\n');
  }
  if(t==='mail'){
    const to=g('m-to');if(!to)return '';
    const q=[];
    if(g('m-sub'))q.push('subject='+encodeURIComponent(g('m-sub')));
    if(g('m-body'))q.push('body='+encodeURIComponent(g('m-body')));
    return 'mailto:'+to+(q.length?'?'+q.join('&'):'');
  }
}

$('gen').onclick=()=>{
  const v=payload();
  if(!v){$('qr').classList.add('hide');$('dl').classList.add('hide');return;}
  const q=qrcode(0,logo?'H':'M');
  q.addData(v,'Byte');q.make();
  const n=q.getModuleCount(),s=8,m=4*s,size=n*s+m*2;
  const c=$('qr');c.width=c.height=size;
  const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,size,size);
  x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(m+k*s,m+r*s,s,s);
  if(logo){
    const L=Math.round(size*0.22),p=Math.round(L*0.12),cx=(size-L)/2;
    x.fillStyle='#fff';x.fillRect(cx-p,cx-p,L+2*p,L+2*p);
    const r=Math.min(L/logo.width,L/logo.height),w=logo.width*r,h=logo.height*r;
    x.drawImage(logo,(size-w)/2,(size-h)/2,w,h);
  }
  c.classList.remove('hide');$('dl').classList.remove('hide');
};

$('dl').onclick=async()=>{
  const c=$('qr'),C=window.Capacitor;
  try{
    if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins.Filesystem&&C.Plugins.Share){
      const r=await C.Plugins.Filesystem.writeFile({path:'qr-'+Date.now()+'.png',data:c.toDataURL('image/png').split(',')[1],directory:'CACHE'});
      await C.Plugins.Share.share({title:'QR',url:r.uri});
      return;
    }
  }catch(e){}
  c.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='qr-code.png';
    document.body.appendChild(a);a.click();a.remove();
  },'image/png');
};

// ---------- قراءة ----------
let last='';
function show(t){
  last=t;
  $('res').textContent=t;$('res').classList.remove('hide');
  $('copy').classList.remove('hide');
  const ok=/^(https?:\/\/|mailto:|tel:)/i.test(t);
  $('open').classList.toggle('hide',!ok);
  $('open').textContent=/^mailto:/i.test(t)?'فتح البريد':/wa\.me|whatsapp/i.test(t)?'فتح واتساب':'فتح الرابط';
  $('msg').textContent=/^BEGIN:VCARD/i.test(t)?'هاي جهة اتصال (vCard).':'';
}
function decode(d,w,h){const r=jsQR(d,w,h,{inversionAttempts:'attemptBoth'});return r?r.data:null;}
function stopCam(){
  if(raf)cancelAnimationFrame(raf);raf=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('vid').srcObject=null;$('cam').textContent='تشغيل الكاميرا';
}
$('cam').onclick=async()=>{
  if(stream){stopCam();return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}
  catch(e){$('msg').textContent='ما قدرت أفتح الكاميرا، تأكد من الصلاحيات.';return;}
  const v=$('vid');v.srcObject=stream;await v.play();
  $('cam').textContent='إيقاف الكاميرا';
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const loop=()=>{
    if(v.readyState===v.HAVE_ENOUGH_DATA){
      c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
      const t=decode(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(t){show(t);if(navigator.vibrate)navigator.vibrate(100);stopCam();return;}
    }
    raf=requestAnimationFrame(loop);
  };
  loop();
};
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const x=c.getContext('2d');x.drawImage(img,0,0);
    const t=decode(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
    t?show(t):($('msg').textContent='ما لقيت QR بالصورة.');
  };
  img.src=URL.createObjectURL(f);e.target.value='';
};
$('copy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(last);
$('open').onclick=()=>{/^(mailto:|tel:)/i.test(last)?location.href=last:window.open(last,'_blank');};
</script>
</body>
</html>
